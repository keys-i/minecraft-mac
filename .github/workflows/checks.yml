name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - run: cargo +1.97.1 fmt --check
      - run: cargo +1.97.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.97.1 test --locked
      - run: cargo +1.97.1 fmt --manifest-path stream/Cargo.toml --check
      - run: cargo +1.97.1 clippy --locked --manifest-path stream/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.97.1 test --locked --manifest-path stream/Cargo.toml
      - run: rustup target add aarch64-unknown-linux-gnu riscv64gc-unknown-linux-gnu
      - run: cargo +1.97.1 check --locked --manifest-path stream/Cargo.toml --target aarch64-unknown-linux-gnu
      - run: cargo +1.97.1 check --locked --manifest-path stream/Cargo.toml --target riscv64gc-unknown-linux-gnu
      - run: ./minecraft source check
      - run: sha256sum --check --quiet tools/SOURCE-SHA256.txt
  native-launcher:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - run: ./minecraft build launcher
      - name: Check native rendering, input and route clearance
        run: ./minecraft build test
  account-helper:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - run: ./minecraft source fetch --project xodus
      - run: command -v protoc || brew install protobuf
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: |
          mkdir -p sources/xodus/crates/xodus-cli/examples
          cp src/standalone-helper.rs sources/xodus/crates/xodus-cli/examples/standalone_helper.rs
          cargo +1.98.0 test --locked --manifest-path sources/xodus/Cargo.toml -p xodus-cli --example standalone_helper
