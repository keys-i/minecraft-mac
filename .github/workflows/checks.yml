name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python minecraft.py source check
      - run: sha256sum --check --quiet tools/SOURCE-SHA256.txt
  native-launcher:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 minecraft.py build launcher
  account-helper:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python3 minecraft.py source fetch --project xodus
      - run: command -v protoc || brew install protobuf
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: |
          mkdir -p sources/xodus/crates/xodus-cli/examples
          cp src/standalone-helper.rs sources/xodus/crates/xodus-cli/examples/standalone_helper.rs
          cargo +1.98.0 test --locked --manifest-path sources/xodus/Cargo.toml -p xodus-cli --example standalone_helper
