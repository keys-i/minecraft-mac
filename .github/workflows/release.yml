name: Source release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  archive:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Package reviewed source
        run: |
          python minecraft.py source check
          mkdir -p outputs
          python minecraft.py source export outputs/minecraft-mac
          tar -C outputs -czf outputs/minecraft-mac-source.tar.gz minecraft-mac
          cd outputs
          sha256sum minecraft-mac-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-${{ github.sha }}
          path: |
            outputs/minecraft-mac-source.tar.gz
            outputs/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.ref_type == 'tag'
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-${{ github.sha }}
          path: outputs
      - name: Publish source preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd outputs
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" minecraft-mac-source.tar.gz SHA256SUMS \
            --verify-tag --prerelease --latest=false --title "$RELEASE_TAG" \
            --notes 'Reviewed source preview with SHA-256 checksums. Build instructions and binary release limits are in docs/status.md inside the archive. The game and runtime binaries are obtained separately'
