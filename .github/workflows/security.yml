name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            os: ubuntu-24.04
            build: none
          - language: swift
            os: macos-15
            build: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build }}
      - name: Build Swift launcher for analysis
        if: matrix.language == 'swift'
        run: python3 minecraft.py build launcher
      - uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac # v4.39.0
        with:
          category: /language:${{ matrix.language }}
