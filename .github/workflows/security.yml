name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac # v4.39.0
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac # v4.39.0
        with:
          category: /language:python
