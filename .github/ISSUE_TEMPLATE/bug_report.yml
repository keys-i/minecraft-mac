name: Report a problem
description: Something went wrong with setup, launch or gameplay
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you tried and what happened. For setup help, start with the [player guide](https://github.com/keys-i/minecraft-mac/blob/main/docs/play.md)

        Keep passwords, tokens, signed download links, account details and full logs private. Report security issues through [private reporting](https://github.com/keys-i/minecraft-mac/security/advisories/new)
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Installing or downloading
        - Microsoft sign-in or Keychain
        - Opening Minecraft
        - Menus or gameplay
        - Servers, friends or Realms
        - Accessibility or keyboard controls
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      placeholder: Describe what you expected, what appeared instead and the last setup stage you saw
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. Open the app
        2. Choose ...
        3. ...
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac chip and macOS version
      placeholder: M3 Pro, macOS 27
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App build or source commit
      placeholder: The build filename or commit, or Unknown if you cannot find it
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Minecraft version, if the game opens
  - type: dropdown
    id: install
    attributes:
      label: Has this installation worked before?
      options:
        - This is my first setup
        - I am retrying an incomplete setup
        - It worked before an app or game update
        - It worked before, without an update
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or short error excerpt
      description: Optional — remove personal information before sharing
