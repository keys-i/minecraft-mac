[package]
name = "minecraft-mac"
version = "0.17.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "MinecraftWorker"
path = "src/worker/main.rs"

[dependencies]
anyhow = "=1.0.104"
cab = "=0.6.0"
cfb = "=0.16.0"
flate2 = "=1.1.11"
libc = "=0.2.191"
plist = "=1.10.4"
regex = "=1.13.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
roxmltree = "=0.21.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
signal-hook = "=0.4.6"
tempfile = "=3.27.0"
tar = "=0.4.46"
zip = { version = "=9.7.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
