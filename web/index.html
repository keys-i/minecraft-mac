<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0c">
  <title>Minecraft Stream</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <video id="game" playsinline></video>
    <section id="start" aria-labelledby="title">
      <p class="eyebrow">PRIVATE CLOUD SESSION</p>
      <h1 id="title">Minecraft</h1>
      <p id="message">Your native game is ready to stream</p>
      <button id="connect" type="button">Connect</button>
    </section>
    <div id="bar" hidden>
      <span id="state" role="status">Connecting</span>
      <output id="stats" aria-label="Stream performance"></output>
      <button id="fullscreen" type="button">Full screen</button>
    </div>
    <div id="capture" hidden>Click the game to capture the mouse · Esc releases it</div>
  </main>
</body>
</html>
